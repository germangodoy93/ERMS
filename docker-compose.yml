# ERMS local development environment.
#   cp .env.example .env   (then set POSTGRES_PASSWORD and JWT_SECRET)
#   docker compose up --build
# Web: http://localhost:5173 · API docs: http://localhost:8000/api/v1/docs
# Email inbox (Mailpit): http://localhost:8025
name: erms

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-erms}
      POSTGRES_USER: ${POSTGRES_USER:-erms}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      TZ: UTC
    ports:
      - "${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infrastructure/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:8-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Captures outgoing email in development. Inbox: http://localhost:8025
  mailpit:
    image: axllent/mailpit:v1.33.1
    ports:
      - "8025:8025"

  backend:
    build:
      context: ./backend
      target: dev
    environment:
      ENVIRONMENT: development
      DATABASE_URL: postgresql://${POSTGRES_USER:-erms}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-erms}
      ERMS_TEST_DATABASE_URL: postgresql://${POSTGRES_USER:-erms}:${POSTGRES_PASSWORD}@db:5432/erms_test
      REDIS_URL: redis://redis:6379/0
      RUN_MIGRATIONS: "true"
      LOG_JSON: "${LOG_JSON:-false}"
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env (openssl rand -hex 32)}
      FRONTEND_URL: http://localhost:5173
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      SMTP_STARTTLS: "false"
    ports:
      - "8000:8000"
    volumes:
      - ./backend/app:/app/app
      - ./backend/alembic:/app/alembic
      - ./backend/tests:/app/tests
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      mailpit:
        condition: service_started
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health/live')",
        ]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 15s

  frontend:
    build:
      context: ./frontend
      target: dev
    environment:
      VITE_API_PROXY_TARGET: http://backend:8000
    ports:
      - "5173:5173"
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
      - ./frontend/index.html:/app/index.html
    depends_on:
      backend:
        condition: service_healthy

volumes:
  pgdata:
  redisdata:
